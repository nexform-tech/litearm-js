<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiteArm 夹爪遥操 — 调试面板</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
.c { max-width: 720px; margin: 0 auto; padding: 20px; }
h1 { text-align: center; margin-bottom: 20px; font-size: 22px; }
.card { background: #16213e; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.card h2 { font-size: 14px; color: #888; margin-bottom: 12px; border-bottom: 1px solid #222; padding-bottom: 6px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
.row label { font-size: 12px; color: #888; min-width: 76px; }
input, select { background: #1a1a2e; border: 1px solid #333; color: #eee; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
input[type=number] { width: 90px; text-align: center; }
.btn { padding: 9px 18px; border: none; border-radius: 4px; font-size: 13px; cursor: pointer; transition: all 0.15s; }
.btn:hover { opacity: 0.85; }
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-c { background: #0f3460; color: #e94560; }  /* connect */
.btn-master { background: #1a3a3a; color: #4ecca3; }
.btn-slave  { background: #533483; color: #fff; }
.btn-exit   { background: #e94560; color: #fff; }
.btn-s { background: #533483; color: #fff; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; }
.badge-ok { background: #0d3b2e; color: #4ecca3; }
.badge-err { background: #3d1010; color: #e94560; }
.badge-warn { background: #3d2e0d; color: #e9c545; }
.kv { display: inline-block; margin: 4px 12px 4px 0; font-size: 12px; }
.kv .k { color: #888; }
.kv .v { color: #4ecca3; font-family: monospace; font-weight: 600; }
.bar-wrap { background: #1a1a2e; border: 1px solid #333; border-radius: 6px; height: 26px; position: relative; overflow: hidden; margin: 8px 0; }
.bar-fill { background: linear-gradient(90deg,#0f3460,#4ecca3); height: 100%; width: 0%; transition: width 0.1s linear; }
.bar-label { position: absolute; top: 0; left: 0; right: 0; line-height: 26px; text-align: center; font-family: monospace; font-size: 12px; color: #fff; text-shadow: 0 0 3px #000; }
.log { background: #0d0d1a; border-radius: 6px; padding: 10px; max-height: 220px; overflow-y: auto; font-family: monospace; font-size: 11px; line-height: 1.5; }
.log .e { color: #e94560; } .log .i { color: #4ecca3; } .log .w { color: #e9c545; }
.hint { font-size: 11px; color: #666; margin-top: 4px; }
.mode-box { border: 1px solid #2a2a44; border-radius: 8px; padding: 12px; margin-top: 8px; }
.mode-box h3 { font-size: 12px; color: #4ecca3; margin-bottom: 8px; }
.mode-box.slave h3 { color: #b39ddb; }
</style>
</head>
<body>
<div class="c">
  <h1>🦾 夹爪遥操调试面板</h1>

  <!-- 连接 -->
  <div class="card">
    <h2>🔌 连接 <span id="st" class="badge badge-warn">未连接</span></h2>
    <div class="row">
      <label>Server WS</label>
      <input type="text" id="ep" value="192.168.31.72:7449" style="flex:1;max-width:220px">
      <input type="text" id="tk" placeholder="token(可选)" style="width:110px">
      <button id="bc" class="btn btn-c" onclick="doConnect()">连接</button>
      <button id="bd" class="btn btn-s" onclick="doDisconnect()" disabled>断开</button>
    </div>
    <div class="row">
      <label>夹爪 ID</label>
      <input type="text" id="did" value="end_0" style="width:120px">
      <span class="hint">device-id（默认 end_0）</span>
    </div>
  </div>

  <!-- 遥操状态 -->
  <div class="card">
    <h2>📡 遥操状态 <span id="ts" class="badge badge-err">未启动</span></h2>
    <div class="bar-wrap">
      <div id="openbar" class="bar-fill"></div>
      <div id="openlabel" class="bar-label">开合度 --</div>
    </div>
    <div>
      <span class="kv"><span class="k">模式</span> <span class="v" id="k_mode">--</span></span>
      <span class="kv"><span class="k">帧数</span> <span class="v" id="k_frames">--</span></span>
      <span class="kv"><span class="k">循环</span> <span class="v" id="k_hz">--</span> Hz</span>
      <span class="kv"><span class="k">帧龄</span> <span class="v" id="k_age">--</span> ms</span>
      <span class="kv"><span class="k">stale</span> <span class="v" id="k_stale">--</span></span>
    </div>
  </div>

  <!-- 控制 -->
  <div class="card">
    <h2>🎮 遥操控制</h2>

    <div class="mode-box master">
      <h3>主夹爪 (Master) — 零重力，手动掰动，发布开合度</h3>
      <div class="row">
        <label>频率 Hz</label>
        <input type="number" id="m_rate" value="50" step="10">
        <button id="bMaster" class="btn btn-master" onclick="enterMaster()" disabled>▶ 启动 Master</button>
      </div>
      <div class="hint">主机 server 的 --endpoint 必须是 tcp/0.0.0.0:7447（非回环），从机才能连上。</div>
    </div>

    <div class="mode-box slave">
      <h3>从夹爪 (Slave) — 连接主夹爪 IP，订阅并跟随</h3>
      <div class="row">
        <label>主机 IP</label>
        <input type="text" id="s_ip" value="192.168.31.72" style="width:150px">
        <label>端口</label>
        <input type="number" id="s_port" value="7447">
      </div>
      <div class="row">
        <label>主夹爪 ID</label>
        <input type="text" id="s_mid" value="end_0" style="width:120px">
        <label>频率 Hz</label>
        <input type="number" id="s_rate" value="50" step="10">
      </div>
      <div class="row">
        <label>kp</label>
        <input type="number" id="s_kp" value="80" step="10">
        <label>kd</label>
        <input type="number" id="s_kd" value="2" step="0.5">
        <label style="min-width:auto"><input type="checkbox" id="s_align" checked> 启动对齐</label>
      </div>
      <div class="row">
        <button id="bSlave" class="btn btn-slave" onclick="enterSlave()" disabled>▶ 启动 Slave</button>
      </div>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="bExit" class="btn btn-exit" onclick="exitTeleop()" disabled>■ 退出遥操（回手动态）</button>
    </div>
  </div>

  <!-- 日志 -->
  <div class="card">
    <h2>📋 日志</h2>
    <div id="log" class="log"></div>
  </div>
</div>

<script type="module">
import { Arm } from "/dist/litearm.mjs?v=9";

let arm = null, dev = null, statusTimer = 0;

function log(msg, cls) {
  const el = document.getElementById("log");
  const d = document.createElement("div");
  d.className = cls === "e" ? "e" : cls === "w" ? "w" : "i";
  d.textContent = new Date().toLocaleTimeString().slice(0,8) + "  " + msg;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

function setBadge(id, text, kind) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "badge " + (kind === "ok" ? "badge-ok" : kind === "err" ? "badge-err" : "badge-warn");
}

function refreshButtons(active) {
  const connected = !!arm?.connected;
  document.getElementById("bMaster").disabled = !connected || active;
  document.getElementById("bSlave").disabled = !connected || active;
  document.getElementById("bExit").disabled = !connected || !active;
}

// ── 连接 ──
window.doConnect = async () => {
  const ep = document.getElementById("ep").value.trim();
  const tk = document.getElementById("tk").value.trim();
  try {
    arm = new Arm(ep, tk);
    await arm.connect();
    const did = document.getElementById("did").value.trim() || "end_0";
    dev = arm.device(did);
    setBadge("st", "已连接", "ok");
    document.getElementById("bc").disabled = true;
    document.getElementById("bd").disabled = false;
    log("已连接 " + ep + " 夹爪=" + did, "i");
    refreshButtons(false);
    startStatusPoll();
  } catch (e) {
    setBadge("st", "连接失败", "err");
    log("连接失败: " + (e?.message || e), "e");
  }
};

window.doDisconnect = () => {
  stopStatusPoll();
  try { arm?.disconnect?.(); } catch {}
  arm = null; dev = null;
  setBadge("st", "未连接", "warn");
  setBadge("ts", "未启动", "err");
  document.getElementById("bc").disabled = false;
  document.getElementById("bd").disabled = true;
  refreshButtons(false);
  log("已断开", "w");
};

// ── 遥操控制 ──
window.enterMaster = async () => {
  try {
    const rate = +document.getElementById("m_rate").value || 50;
    const r = await dev.gripperTeleopEnter({ mode: "master", rateHz: rate });
    log("Master 已启动: " + JSON.stringify(r), "i");
    refreshButtons(true);
  } catch (e) { log("启动 Master 失败: " + (e?.message||e), "e"); }
};

window.enterSlave = async () => {
  try {
    const ip = document.getElementById("s_ip").value.trim();
    const port = +document.getElementById("s_port").value || 7447;
    const mid = document.getElementById("s_mid").value.trim() || "end_0";
    const rate = +document.getElementById("s_rate").value || 50;
    const kp = +document.getElementById("s_kp").value || 80;
    const kd = +document.getElementById("s_kd").value || 2;
    const align = document.getElementById("s_align").checked;
    const peer = `tcp/${ip}:${port}`;
    const r = await dev.gripperTeleopEnter({
      mode: "slave", peer, masterId: mid, rateHz: rate, kp, kd, align,
    });
    log("Slave 已启动 → " + peer + " master=" + mid + ": " + JSON.stringify(r), "i");
    refreshButtons(true);
  } catch (e) { log("启动 Slave 失败: " + (e?.message||e), "e"); }
};

window.exitTeleop = async () => {
  try {
    await dev.gripperTeleopExit();
    log("已退出遥操，回到手动态", "w");
    refreshButtons(false);
    setBadge("ts", "未启动", "err");
  } catch (e) { log("退出失败: " + (e?.message||e), "e"); }
};

// ── 状态轮询（用 gripper_teleop_status，不碰 CAN 锁）──
function startStatusPoll() {
  stopStatusPoll();
  statusTimer = setInterval(async () => {
    if (!dev) return;
    try {
      const s = await dev.gripperTeleopStatus();
      const active = !!s.active;
      refreshButtons(active);
      if (!active) {
        setBadge("ts", "未启动", "err");
        return;
      }
      const stale = !!s.stale;
      setBadge("ts", stale ? "运行(STALE)" : "运行中", stale ? "warn" : "ok");
      const op = typeof s.openness === "number" ? s.openness : 0;
      document.getElementById("openbar").style.width = (op * 100).toFixed(1) + "%";
      document.getElementById("openlabel").textContent =
        "开合度 " + (op * 100).toFixed(1) + "%";
      document.getElementById("k_mode").textContent = s.mode ?? "--";
      document.getElementById("k_frames").textContent = s.frames ?? "--";
      document.getElementById("k_hz").textContent = s.loop_hz ?? "--";
      document.getElementById("k_age").textContent =
        (s.last_frame_age_ms == null) ? "--" : (+s.last_frame_age_ms).toFixed(0);
      document.getElementById("k_stale").textContent = stale ? "是" : "否";
    } catch (e) {
      /* 遥操中 status 白名单放行；失败静默 */
    }
  }, 200);
}
function stopStatusPoll() { if (statusTimer) { clearInterval(statusTimer); statusTimer = 0; } }

log("就绪。请先连接 server WS，再启动 Master 或 Slave。", "i");
</script>
</body>
</html>
